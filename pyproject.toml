[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-download-service"
version = "0.1.0"
description = "Safe media metadata inspection and download worker for the web trial."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
  "yt-dlp>=2025.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
