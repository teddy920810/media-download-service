[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-download-service"
version = "0.1.0"
description = "Safe media metadata inspection and download worker for the web trial."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35,<2",
  "bgutil-ytdlp-pot-provider==1.3.1",
  "fastapi>=0.115,<1",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
  "yt-dlp[default]>=2025.1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
